
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deligent Dreamers</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: #fff;
    }

    .container {
      width: 90%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 2.2em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }

    .coin-select {
      margin-bottom: 20px;
      font-size: 1.1em;
    }

    .address-section {
      margin-bottom: 20px;
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 5px;
      background-color: rgba(255, 255, 255, 0.2);
      word-wrap: break-word;
    }

    .address-display {
      margin-bottom: 10px;
      font-size: 1.1em;
      background: #fff;
      color: #000;
      padding: 10px;
      border-radius: 5px;
      overflow-wrap: break-word;
    }

    .copy-button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.1em;
    }

    .copy-button:hover {
      background-color: #45a049;
    }

    .send-screenshot-button {
      padding: 10px 20px;
      background-color: #25D366;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.1em;
    }

    .send-screenshot-button:hover {
      background-color: #128C7E;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 1em;
      background-color: rgba(255,255,255,0.2);
      padding: 12px;
      border-radius: 8px;
    }

    .footer img {
      width: 20px;
      vertical-align: middle;
      margin-right: 6px;
    }

    @media screen and (max-width: 480px) {
      .address-display {
        font-size: 1em;
        word-break: break-word;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Deligent Dreamers</h1>

    <div class="coin-select">
      <label for="coin">کوائن منتخب کریں:</label>
      <select id="coin">
        <option value="">منتخب کریں</option>
        <option value="sidra">Sidra (30 PKR Rate)</option>
      </select>
    </div>

    <div class="address-section" id="address-section" style="display: none;">
      <h2>Sidra Receiving Address</h2>
      <div class="address-display" id="address"></div>
      <button class="copy-button" onclick="copyAddress()">Copy Sidra Address</button>
    </div>

    <div>
      <a href="https://wa.me/message/CSL6FOXML727L1" target="_blank">
        <button class="send-screenshot-button">اسکرین شاٹ بھیجیں</button>
      </a>
    </div>

    <div class="footer">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp Logo">
      For any issue please contact WhatsApp: <strong>03405445350</strong>
    </div>
  </div>

  <script>
    const coinSelect = document.getElementById('coin');
    const addressDisplay = document.getElementById('address');
    const addressSection = document.getElementById('address-section');

    const addresses = {
      sidra: "0x995a89c9fd2B729857541215E5A405303eA48A08"
    };

    coinSelect.addEventListener('change', function () {
      const selectedCoin = this.value;
      if (addresses[selectedCoin]) {
        addressDisplay.textContent = addresses[selectedCoin];
        addressSection.style.display = "block";
      } else {
        addressDisplay.textContent = "";
        addressSection.style.display = "none";
      }
    });

    function copyAddress() {
      const addressText = addressDisplay.textContent;
      if (addressText) {
        navigator.clipboard.writeText(addressText)
          .then(() => {
            alert('ایڈریس کاپی ہو گیا!');
          })
          .catch(err => {
            alert('ایڈریس کاپی کرنے میں مسئلہ پیش آیا۔');
          });
      } else {
        alert('کوئی ایڈریس دستیاب نہیں!');
      }
    }
  </script>
</body>
</html>
